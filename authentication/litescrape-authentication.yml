key_management:
  issue: Get your API key at https://litescrape.com (5 free calls on a new visitor key; one free key per browser, 409 otherwise)
  status: GET /api/keys/status returns remaining_calls, concurrency_limit, status, zdr_enabled, zdr_available
  settings: 'PATCH /api/keys/zdr {"zdr_enabled": true|false} for keys with a paid top-up'
