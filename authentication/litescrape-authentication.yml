  primary: Bearer API key (ls_live_ prefix) in the Authorization header against https://api.litescrape.com
  storefront: The published OpenAPI describes the ZeroClick agent storefront at agents.litescrape.com, whose planAccess bearer
    token comes from the storefront's own OAuth 2.0 token endpoint (https://agents.litescrape.com/oauth2/token, issuer https://agentauth.zeroclick.io,
