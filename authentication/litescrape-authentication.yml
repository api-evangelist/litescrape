schemes:
- name: apiKeyBearer
  type: http
  scheme: bearer
  key_prefix: ls_live_
  header: Authorization
  description: '"Send Authorization: Bearer YOUR_API_KEY in the request headers. Never place your key in the URL or browser
    bundle." Missing or malformed bearer headers return 401 missing_api_key; invalid keys return 401 invalid_api_key; disabled
    keys return 403 api_key_disabled (key-status page; 401s observed live with WWW-Authenticate: Bearer). The same key is
    optional on the hosted MCP server (Authorization: Bearer, or ?api_key= in HTTP mode).'
  docs: https://litescrape.com/docs/key-status
  sources:
  - https://litescrape.com/docs/key-status
  - https://litescrape.com/docs/reference
- name: planAccess
  type: http
  scheme: bearer
  description: 'Plan access. Calls are sold on plans (credit or subscription), not per call: an unidentified call returns
    401 bearer_required with a registration recipe, and an identified call with no covering plan returns 403 plan_required
    listing the plans that cover it. Reuse your existing agent identity; register only if new (anonymous registration is one
    free API call; the recipe is at https://agents.litescr'
  sources:
