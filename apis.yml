apis:
- name: Litescrape MCP Server
  description: >-
    Hosted Model Context Protocol server (Streamable HTTP, protocol 2025-06-18) exposing ten search, maps,
    reviews and web-fetch tools backed by the Litescrape API; google_search, bing_search, duckduckgo_search
    and google_maps work without a key under a daily per-network allowance, and an Authorization Bearer
    API key unlocks the rest. The same server ships as the npm package litescrape-mcp-server for local
    stdio use.
