  /api/duckduckgo/maps:
    get:
      summary: DuckDuckGo local places
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Duckduckgo Maps
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - coffee
          maxLength: 500
          minLength: 1
        example: coffee
        required: true
        description: Place or category query, 1 to 500 characters.
      - in: query
        name: bbox
        schema:
          type: string
          examples:
          - 30.35,-97.90,30.10,-97.50
          maxLength: 256
        required: false
        description: Map rectangle as top,left,bottom,right (latitude,longitude of the top-left corner, then of the bottom-right corner); must not wrap the antimeridian. Use instead of lat/lon; one of the two is required.
      - in: query
        name: lat
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 30.2672
        required: false
        description: Map center latitude from -90 through 90. Requires lon; use instead of bbox.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -97.7431
        required: false
        description: Map center longitude from -180 through 180. Requires lat; use instead of bbox.
      - in: query
        name: strict_bbox
        schema:
          type: boolean
          default: true
        required: false
        description: Exclude results outside the requested bounds.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns places from DuckDuckGo's local results in `local_results`. Supply either `bbox` or both `lat` and `lon` to set the map area.
      operationId: duckduckgo_maps
