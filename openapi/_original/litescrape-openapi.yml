        description: Pre-encoded Google location token, up to 2,048 characters. Use only one of location, uule, or lat and lon.
      - in: query
        name: lat
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 30.2672
        required: false
        description: Latitude between -90 and 90. Supply with lon; conflicts with location and uule.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -97.7431
        required: false
        description: Longitude between -180 and 180. Supply with lat; conflicts with location and uule.
      - in: query
        name: radius
        schema:
          type: number
          maximum: 1000
          minimum: 1
        required: false
        description: Search radius in meters around location or lat and lon, which it requires. 1 to 199 on desktop, 1 to 1,000 on tablet or mobile.
      - in: query
        name: lsig
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Opaque Google local or Knowledge Graph signature, up to 4,096 characters.
      - in: query
        name: si
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Opaque cached Google search context, up to 4,096 characters.
      - in: query
        name: ibp
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Google layout or expansion control, up to 4,096 characters.
      - in: query
        name: uds
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Opaque Google filter token, up to 4,096 characters.
      - in: query
        name: color_scheme
        schema:
          enum:
          - light
          - dark
          type: string
        required: false
        description: Google's light or dark result presentation.
      - in: query
        name: google_domain
        schema:
          type: string
          default: google.com
          examples:
          - google.com
        required: false
        description: A Google domain from Google's supported list, such as google.com or google.co.uk.
      - in: query
        name: gl
        schema:
          type: string
          pattern: ^[a-z]{2}$
          examples:
          - us
        required: false
        description: Lowercase two-letter country code used to localize results.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          pattern: ^[a-z]{2,3}(-[A-Za-z]{2,8})?$
          examples:
          - en
        required: false
        description: Google interface and result language, such as en, en-US, or de. Defaults to en.
      - in: query
        name: cr
        schema:
          type: string
          pattern: ^country[A-Z]{2}(\|country[A-Z]{2})*$
          examples:
          - countryUS
        required: false
        description: 'Country restriction: one or more countryXX values joined with |, such as countryUS.'
      - in: query
        name: lr
        schema:
          type: string
          pattern: ^lang_[a-z]{2,3}(\|lang_[a-z]{2,3})*$
          examples:
          - lang_en
        required: false
        description: 'Language restriction: one or more lang_xx values joined with |, such as lang_en.'
      - in: query
        name: device
        schema:
          enum:
          - desktop
          - tablet
          - mobile
          type: string
          default: desktop
          examples:
          - desktop
        required: false
        description: 'Google returns its real layout for the selected device: desktop, tablet, or mobile.'
      - in: query
        name: tbs
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Google search-filter string, such as qdr:w, up to 4,096 characters.
      - in: query
        name: safe
        schema:
          enum:
          - active
          - 'off'
          type: string
        required: false
        description: 'Google adult-content filtering: active or off.'
      - in: query
        name: nfpr
        schema:
          enum:
          - '0'
          - '1'
          type: string
        required: false
        description: Set 1 to disable Google spelling auto-correction, or 0 to allow it.
      - in: query
        name: filter
        schema:
          enum:
          - '0'
          - '1'
          type: string
        required: false
        description: 'Google similar-results filtering: 0 or 1.'
      - in: query
        name: pws
        schema:
          enum:
          - '0'
          - '1'
          type: string
        required: false
        description: 'Google personalization flag: 0 or 1. 0 asks for non-personalized results.'
      - in: query
        name: peek_pws
        schema:
          enum:
          - '0'
          - '1'
          type: string
        required: false
        description: 'Google personalization companion flag: 0 or 1, forwarded to Google unchanged.'
      - in: query
        name: tbm
        schema:
          enum:
          - lcl
          - vid
          - nws
          - shop
          - pts
          type: string
        required: false
        description: 'Google vertical: lcl, vid, nws, shop, or pts. Google Images (isch) is rejected with 400 unsupported_search_vertical.'
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          minimum: 0
          examples:
          - 10
        required: false
        description: Result offset for pagination. Defaults to 0.
      - in: query
        name: num
        schema:
          type: integer
          maximum: 10
          minimum: 1
        required: false
        description: 'Requested result count, 1 to 10. A best-effort hint: Google may return fewer rows, and results are never padded.'
      - in: query
        name: as_dt
        schema:
          enum:
          - i
          - e
          type: string
        required: false
        description: Include (i) or exclude (e) the as_sitesearch host. Requires as_sitesearch.
      - in: query
        name: as_epq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Exact phrase the results must contain, up to 2,048 characters.
      - in: query
        name: as_eq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Words the results must not contain, up to 2,048 characters.
      - in: query
        name: as_lq
        schema:
          type: string
          pattern: ^https?://[^/\s]
          maxLength: 4096
        required: false
        description: Return pages that link to this complete HTTP(S) URL.
      - in: query
        name: as_nlo
        schema:
          type: integer
          minimum: 0
        required: false
        description: Lower bound of a number range. Supply with as_nhi.
      - in: query
        name: as_nhi
        schema:
          type: integer
          minimum: 0
        required: false
        description: Upper bound of a number range. Supply with as_nlo.
      - in: query
        name: as_oq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Additional terms of which any may match, up to 2,048 characters.
      - in: query
        name: as_q
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Additional terms that must all match, up to 2,048 characters.
      - in: query
        name: as_qdr
        schema:
          type: string
          pattern: ^[dwmyDWMY]([1-9][0-9]*)?$
          examples:
          - m3
        required: false
        description: 'Date range: d, w, m, or y with an optional positive count, such as m3 for the past three months.'
      - in: query
        name: as_rq
        schema:
          type: string
          pattern: ^https?://[^/\s]
          maxLength: 4096
        required: false
        description: Return pages related to this complete HTTP(S) URL.
      - in: query
        name: as_sitesearch
        schema:
          type: string
          examples:
          - example.com
          maxLength: 253
        required: false
        description: Hostname to include or exclude, such as example.com. A hostname, not a URL.
      - in: query
        name: oq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Original query text from a Google URL, up to 2,048 characters; forwarded unchanged.
      - in: query
        name: gs_lp
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Opaque Google autocomplete-session value from a Google URL, up to 4,096 characters; forwarded unchanged.
      - in: query
        name: sclient
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]+$
          maxLength: 64
        required: false
        description: 'Google client label such as gws-wiz-serp: up to 64 letters, digits, dots, underscores, or hyphens.'
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: 'Returns a Google results page as JSON: organic results plus every other result group Google served, such as ads, AI Overview, knowledge graph, and local results. Supply at least one of q, ludocid, or kgmid; page through results with start. Set fast_mode=true to return organic results only.'
      operationId: google_search
