        required: false
        description: Latitude of the map center. Supply with lon and either z or m. Mutually exclusive with ll and location.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
        required: false
        description: Longitude of the map center. Supply with lat and either z or m. Mutually exclusive with ll and location.
      - in: query
        name: z
        schema:
          type: number
          maximum: 30
          minimum: 3
        required: false
        description: Zoom level from 3 through 30. Use with location or lat/lon. Mutually exclusive with m.
      - in: query
        name: m
        schema:
          type: number
          maximum: 15028132
          minimum: 1
        required: false
