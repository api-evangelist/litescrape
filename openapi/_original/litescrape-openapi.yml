  /api/tripadvisor/search:
    get:
      summary: Tripadvisor search
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Tripadvisor Search
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - coffee
          maxLength: 500
          minLength: 1
        example: coffee
        required: true
        description: Search text, 1 to 500 characters.
      - in: query
        name: tripadvisor_domain
        schema:
          type: string
          default: www.tripadvisor.com
          examples:
          - www.tripadvisor.com
        required: false
        description: Supported first-party localized Tripadvisor hostname, such as www.tripadvisor.co.uk.
      - in: query
        name: locale
        schema:
          type: string
          default: en-US
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
        required: false
        description: Lowercase language code with an optional uppercase country, such as en or en-US.
      - in: query
        name: geo_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          examples:
          - 30196
        required: false
        description: Tripadvisor geography ID to search within.
      - in: query
        name: lat
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 30.2672
        required: false
        description: Search center latitude from -90 through 90. Requires lon.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -97.7431
        required: false
        description: Search center longitude from -180 through 180. Requires lat.
      - in: query
        name: place_type
        schema:
          enum:
          - all
          - accommodation
          - attraction
          - attraction_product
          - eatery
          - geo
          type: string
          default: all
        required: false
        description: Restrict results to one entity type.
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          maximum: 10000
          minimum: 0
        required: false
        description: Result offset from 0 through 10,000. Offsets and positions count any leading exact match.
      - in: query
        name: num
        schema:
          type: integer
          default: 30
          maximum: 30
          minimum: 1
        required: false
        description: Maximum number of search_results, 1 through 30, including any leading exact match.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns Tripadvisor hotels, restaurants, attractions and places in `search_results`. Each row carries the numeric `place_id` plus `place_api_link` and `reviews_api_link` for the Place and Reviews APIs. Page with `start` and `num`, or follow `pagination.next`.
