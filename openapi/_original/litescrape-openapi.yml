                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - coffee Austin Texas
          maxLength: 500
          minLength: 1
        example: coffee Austin Texas
        required: true
        description: Search text, 1 to 500 characters.
      - in: query
        name: kl
        schema:
          type: string
          examples:
          - us-en
          maxLength: 32
        required: false
        description: DuckDuckGo region and language token, such as us-en; up to 32 characters.
      - in: query
        name: search_assist
        schema:
          type: boolean
          default: true
        required: false
        description: Use DuckDuckGo query assistance. Mutually exclusive with m.
      - in: query
        name: safe
        schema:
          enum:
          - '1'
          - '-1'
          - '-2'
          type: string
          default: '-1'
        required: false
        description: 'Safe-search level: 1 is strict, -1 is moderate, -2 is off.'
      - in: query
        name: df
        schema:
          type: string
          pattern: ^(d|w|m|y|\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2})$
          examples:
          - w
          maxLength: 64
        required: false
        description: 'Date filter: d (past day), w (past week), m (past month), y (past year), or a YYYY-MM-DD..YYYY-MM-DD range.'
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          maximum: 10000
          minimum: 0
        required: false
        description: Result offset from 0 through 10,000.
      - in: query
        name: m
        schema:
          type: integer
          default: 50
          maximum: 50
          minimum: 1
        required: false
        description: Number of results, 1 through 50. Mutually exclusive with search_assist.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
