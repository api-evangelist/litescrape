        required: false
        description: Optional search-origin latitude from -90 through 90. Independent of lon and location.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -74.006
        required: false
        description: Optional search-origin longitude from -180 through 180. Independent of lat and location.
      - in: query
        name: mkt
        schema:
          type: string
          pattern: ^[A-Za-z]{2}-[A-Za-z]{2}$
          examples:
          - en-US
        required: false
        description: Bing market in language-country form, such as en-US; case-insensitive. Mutually exclusive with cc.
      - in: query
        name: cc
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
          examples:
