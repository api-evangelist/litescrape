  /api/google/shopping:
    get:
      summary: Google Shopping
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Google Shopping
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - coffee maker
          maxLength: 2048
        required: false
        description: Product search term, up to 2,048 characters. Required unless shoprs is supplied. This is a search, not an exact product ID lookup.
      - in: query
        name: shoprs
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,4096}$
          maxLength: 4096
        required: false
        description: Refinement token from a previous response's filters. An explicit refinement parameter replaces the refinement it carries.
      - in: query
        name: min_price
        schema:
          type: number
          maximum: 1000000000
          minimum: 0
        required: false
        description: Lower price bound in the storefront currency. Cannot be combined with on_sale, free_shipping or small_business.
      - in: query
        name: max_price
        schema:
          type: number
          maximum: 1000000000
          minimum: 0
        required: false
        description: Upper price bound in the storefront currency, at or above min_price. Cannot be combined with on_sale, free_shipping or small_business.
      - in: query
        name: sort_by
        schema:
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          type: string
        required: false
        description: 'Sort order: 1 price low to high, 2 price high to low, 3 rating high to low, 4 relevance (the default). Combines with any one refinement.'
      - in: query
        name: free_shipping
        schema:
          type: boolean
          default: false
        required: false
        description: Show only products with free shipping. Cannot be combined with another refinement.
      - in: query
        name: on_sale
        schema:
          type: boolean
          default: false
        required: false
        description: Show only products Google marks as on sale. Cannot be combined with another refinement.
      - in: query
        name: small_business
        schema:
          type: boolean
          default: false
        required: false
        description: Show only products from small businesses. Cannot be combined with another refinement.
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          maximum: 1000
          minimum: 0
        required: false
        description: Result offset.
      - in: query
        name: num
        schema:
          type: integer
          maximum: 100
          minimum: 1
          examples:
          - 60
        required: false
        description: Number of products to return. Google serves 40 products per page; a larger num reads further pages within the same call and returns fewer only when Google has no more products.
      - in: query
        name: location
        schema:
          type: string
          examples:
          - Austin, Texas
          maxLength: 63
        required: false
        description: Human-readable search location, such as Austin, Texas. At most 63 UTF-8 bytes. Mutually exclusive with uule.
      - in: query
        name: uule
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Pre-encoded Google location token. Mutually exclusive with location.
      - in: query
        name: google_domain
        schema:
          type: string
          default: google.com
          examples:
          - google.com
        required: false
        description: Google domain used for the request.
      - in: query
        name: gl
        schema:
          type: string
          examples:
          - us
          maxLength: 2
          minLength: 2
        required: false
        description: Two-letter country code used to localize results.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          examples:
          - en
        required: false
        description: Language code such as en, en-GB, or de.
      - in: query
        name: device
        schema:
          enum:
          - desktop
          - tablet
          - mobile
          type: string
          default: desktop
        required: false
        description: Google device layout. Each device is served Google's real layout for it.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns the Google Shopping product grid, category blocks, sponsored listings and refinement filters. Google applies one refinement at a time, so min_price/max_price, on_sale, free_shipping and small_business are mutually exclusive; sort_by combines with any one of them. Each clustered product carries a litescrape_product_link to /api/google/shopping/product.
      operationId: google_shopping
