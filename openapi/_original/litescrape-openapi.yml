      - in: query
        name: q
        schema:
          type: string
          examples:
          - pizza shops in New York
          maxLength: 2048
          minLength: 1
        example: pizza shops in New York
        required: true
        description: Search query, up to 2,048 characters with no control characters. Bing search operators are preserved.
      - in: query
        name: location
        schema:
          type: string
          examples:
