  /zeroclick/agent/quote:
    post:
      operationId: sellerAgentQuote
      summary: Get a free seller API quote and purchase guide
      description: Describe your task to get the matching API contract, prices, prerequisites and next steps. This is a $0 wallet-proof lookup, not the seller's paid service. No purchase is executed. Without a wallet, use /zeroclick/agent/guide.
      servers:
      - url: https://agents.litescrape.com
      security:
      - sellerAgentX402: []
      - sellerAgentMpp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                goal:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Describe the task and known inputs. Do not include credentials.
                quantity:
                  description: Number of API calls, not returned items. Omit when unknown; describe desired output in goal.
                  type: integer
                  minimum: 1
                  maximum: 1000000
                budgetUsd:
                  description: Total cash budget in USD. A quote does not authorize spending.
                  type: string
                  pattern: ^(0|[1-9]\d{0,8})(\.\d{1,6})?$
                budgetExclusive:
                  type: boolean
                reviewAfterCalls:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                requirements:
                  type: string
                  minLength: 1
                  maxLength: 300
                humanAvailable:
                  description: Whether a human is in the loop. False recommends anonymous auth for a new autonomous identity; omit when unknown. Executing a human's request without further interruptions does not by itself mean false.
                  type: boolean
                payment:
                  description: Known payment method for the eventual purchase, independent of this free lookup's wallet proof.
                  type: string
                  enum:
                  - x402
                  - mpp
                  - card
              required:
              - goal
              additionalProperties: false
            example:
              goal: Find the available services, prices and purchase steps
      responses:
        '200':
          description: Task guidance; inspect status before executing anything
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - quoted
                    - ready
                    - needs_input
                    - blocked
                    - unknown
                    - unsupported
                    - unavailable
                  priceUsd:
                    type: string
                    const: '0'
                  guide:
                    type: string
                    description: Markdown guidance containing the task result, exact contract, pricing and next steps when available. No purchase is executed.
                  guideUrl:
                    type: string
                    format: uri
                    description: Wallet-free advisor endpoint for further planning or recovery.
                required:
                - status
                - priceUsd
                - guide
                - guideUrl
                additionalProperties: false
        '402':
          description: $0 x402 or MPP wallet proof required; sign and retry the same request. No funds are transferred.
        '503':
          description: Advisor unavailable; use the wallet-free guide or direct storefront references
      x-payment-info:
        access: payg
        price:
          mode: fixed
          currency: USD
          amount: '0'
        protocols:
        - x402:
            network: eip155:8453
            scheme: exact
            currency: USDC
        - mpp:
            method: tempo
            intent: charge
            currency: USD
        offers:
        - amount: '0'
          currency: '0x20C000000000000000000000b9537d11c60E8b50'
          method: tempo
          intent: charge
          description: Free seller advisor lookup
