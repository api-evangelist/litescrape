  /api/google/contributor-reviews:
    get:
      summary: Fetch a Google Maps contributor's reviews
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Google Contributor Reviews
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: contributor_id
        schema:
          type: string
          pattern: ^[0-9]{10,32}$
          examples:
          - '109736708296406538146'
        example: '109736708296406538146'
        required: true
        description: Required 10 to 32 digit contributor ID, from a Google Maps contributor URL (/maps/contrib/{id}/reviews) or user.contributor_id in a Google Reviews response.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
          examples:
          - en
        required: false
        description: Review and interface language such as en, en-US, or fr.
      - in: query
        name: gl
        schema:
          type: string
          default: us
          pattern: ^[A-Za-z]{2}$
          examples:
          - us
        required: false
        description: Two-letter country code used to localize results, normalized to lowercase. Defaults to us.
      - in: query
        name: limit
        schema:
          type: integer
          default: 200
          maximum: 200
          minimum: 1
        required: false
        description: Maximum number of reviews to return, from 1 through 200.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns the public review history of one Google Maps contributor, up to 200 reviews in one response. There is no pagination; search_information.truncated is true when the profile has more reviews than were returned.
