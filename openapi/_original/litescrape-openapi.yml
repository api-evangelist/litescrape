        description: Result offset for pagination. Defaults to 0.
      - in: query
        name: num
        schema:
          type: integer
          maximum: 10
          minimum: 1
        required: false
        description: 'Requested result count, 1 to 10. A best-effort hint: Google may return fewer rows, and results are never padded.'
      - in: query
        name: as_dt
        schema:
          enum:
          - i
          - e
          type: string
        required: false
        description: Include (i) or exclude (e) the as_sitesearch host. Requires as_sitesearch.
      - in: query
        name: as_epq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Exact phrase the results must contain, up to 2,048 characters.
      - in: query
        name: as_eq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Words the results must not contain, up to 2,048 characters.
      - in: query
        name: as_lq
        schema:
          type: string
          pattern: ^https?://[^/\s]
          maxLength: 4096
        required: false
        description: Return pages that link to this complete HTTP(S) URL.
      - in: query
        name: as_nlo
        schema:
          type: integer
          minimum: 0
        required: false
        description: Lower bound of a number range. Supply with as_nhi.
      - in: query
        name: as_nhi
        schema:
          type: integer
          minimum: 0
        required: false
        description: Upper bound of a number range. Supply with as_nlo.
      - in: query
        name: as_oq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Additional terms of which any may match, up to 2,048 characters.
      - in: query
        name: as_q
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Additional terms that must all match, up to 2,048 characters.
      - in: query
        name: as_qdr
        schema:
          type: string
          pattern: ^[dwmyDWMY]([1-9][0-9]*)?$
          examples:
          - m3
        required: false
        description: 'Date range: d, w, m, or y with an optional positive count, such as m3 for the past three months.'
      - in: query
        name: as_rq
        schema:
          type: string
          pattern: ^https?://[^/\s]
          maxLength: 4096
        required: false
        description: Return pages related to this complete HTTP(S) URL.
      - in: query
        name: as_sitesearch
        schema:
          type: string
          examples:
          - example.com
          maxLength: 253
        required: false
        description: Hostname to include or exclude, such as example.com. A hostname, not a URL.
      - in: query
        name: oq
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Original query text from a Google URL, up to 2,048 characters; forwarded unchanged.
      - in: query
        name: gs_lp
        schema:
          type: string
          maxLength: 4096
        required: false
        description: Opaque Google autocomplete-session value from a Google URL, up to 4,096 characters; forwarded unchanged.
      - in: query
        name: sclient
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]+$
          maxLength: 64
        required: false
        description: 'Google client label such as gws-wiz-serp: up to 64 letters, digits, dots, underscores, or hyphens.'
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
