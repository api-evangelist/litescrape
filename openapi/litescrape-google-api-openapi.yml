  /api/google/maps:
    get:
      summary: Search Google Maps places
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Google Maps
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - coffee shops in Austin, TX
        required: false
        description: Search query, such as coffee shops in Austin, TX. Required when type=search. A search needs one of q, place_id, data_cid or data.
      - in: query
        name: type
        schema:
          enum:
          - search
          - place
          type: string
          examples:
          - search
        required: false
        description: search returns a list of places in local_results; place returns one exact place in place_results. Required when searching by q or by filter data, and type=place is required with an exact-place data sequence. Can be omitted with place_id or data_cid.
      - in: query
        name: place_id
        schema:
          type: string
          examples:
          - ChIJT2h1HKZZwokR0kgzEtsa03k
        required: false
        description: Google Place ID for an exact-place lookup. Mutually exclusive with data_cid and an exact-place data sequence.
      - in: query
        name: data_cid
        schema:
          type: string
        required: false
        description: Decimal Google CID for an exact-place lookup. Mutually exclusive with place_id and an exact-place data sequence.
      - in: query
        name: data
        schema:
          type: string
        required: false
        description: Google Maps protobuf sequence copied from a Maps URL, beginning with ! and at most 8,192 characters. A sequence that identifies one place requires type=place and is mutually exclusive with place_id and data_cid.
      - in: query
        name: ll
        schema:
          type: string
          pattern: ^@?-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?,\d+(?:\.\d+)?[zm]$
          examples:
          - '@30.2672,-97.7431,14z'
        required: false
        description: Map viewport as @latitude,longitude,zoomz or @latitude,longitude,radiusm, for example @30.2672,-97.7431,14z. Already includes its scale, so do not add z or m. Mutually exclusive with location and lat/lon.
      - in: query
        name: location
        schema:
          type: string
          examples:
          - Austin, Texas, United States
        required: false
        description: Human-readable location to center the map on, such as Austin, Texas. Requires z or m. Mutually exclusive with ll and lat/lon.
      - in: query
        name: lat
        schema:
          type: number
          maximum: 90
          minimum: -90
        required: false
        description: Latitude of the map center. Supply with lon and either z or m. Mutually exclusive with ll and location.
      - in: query
        name: lon
        schema:
          type: number
          maximum: 180
          minimum: -180
        required: false
        description: Longitude of the map center. Supply with lat and either z or m. Mutually exclusive with ll and location.
      - in: query
        name: z
        schema:
          type: number
          maximum: 30
          minimum: 3
        required: false
        description: Zoom level from 3 through 30. Use with location or lat/lon. Mutually exclusive with m.
      - in: query
        name: m
        schema:
          type: number
          maximum: 15028132
          minimum: 1
        required: false
        description: Map radius in meters, from 1 through 15,028,132. Use with location or lat/lon. Mutually exclusive with z.
      - in: query
        name: nearby
        schema:
          type: boolean
          default: false
        required: false
        description: Set to true to remove near me wording from the query so the supplied viewport is used. Requires ll, location or lat/lon.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          examples:
          - en
        required: false
        description: Language code such as en, en-GB, or de.
      - in: query
        name: gl
        schema:
          type: string
          default: us
          examples:
          - us
          maxLength: 2
          minLength: 2
        required: false
        description: Two-letter country code used to localize results. Defaults to us.
      - in: query
        name: google_domain
        schema:
          type: string
          default: google.com
          examples:
          - google.com
        required: false
        description: Google domain used for the request.
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          minimum: 0
        required: false
        description: 'Result offset in steps of 20: 0, 20, 40 and so on. Prefer following pagination.next from the previous response.'
      - in: query
        name: min_price
        schema:
          type: integer
          minimum: 0
        required: false
        description: Minimum Google price level, a non-negative integer. Must not exceed max_price.
      - in: query
        name: max_price
        schema:
          type: integer
          minimum: 0
        required: false
        description: Maximum Google price level, a non-negative integer. Must be at least min_price.
      - in: query
        name: min_rating
        schema:
          enum:
          - 2
          - 2.5
          - 3
          - 3.5
          - 4
          - 4.5
          type: number
        required: false
        description: Minimum star rating. Google treats it as a relevance preference, so lower-rated or unrated places may still appear.
      - in: query
        name: open_state
        schema:
          enum:
          - now
          - 24h
          type: string
        required: false
        description: now returns places open now; 24h returns places open 24 hours. Cannot be combined with open_on_day or open_at_hour.
      - in: query
        name: open_on_day
        schema:
          enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          type: string
        required: false
        description: Return places open on this weekday, optionally at open_at_hour. Cannot be combined with open_state.
      - in: query
        name: open_at_hour
        schema:
          type: integer
          maximum: 23
          minimum: 0
        required: false
        description: Hour from 0 through 23 at which the place must be open. Requires open_on_day. Cannot be combined with open_state.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Search Google Maps with q and type=search to get up to 20 places in local_results, or look up one exact place by place_id, data_cid or data to get place_results. Follow pagination.next to fetch the next 20 places; each page request is one call.
