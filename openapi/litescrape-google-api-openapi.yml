  /api/google/reviews:
    get:
      summary: Fetch Google Maps reviews
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Google Reviews
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: place_id
        schema:
          type: string
          examples:
          - ChIJT2h1HKZZwokR0kgzEtsa03k
        required: false
        description: Google Place ID. Exactly one of place_id or data_id is required.
      - in: query
        name: data_id
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]+:0x[0-9a-fA-F]+$
          examples:
          - 0x89c258e28c304997:0xfcafe4e7ce35ee8c
        required: false
        description: Hexadecimal Google Maps feature ID, such as the data_id in a Google Maps response. Exactly one of place_id or data_id is required.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          examples:
          - en
        required: false
        description: Review language code such as en, en-GB, or de.
      - in: query
        name: gl
        schema:
          type: string
          default: us
          examples:
          - us
          maxLength: 2
          minLength: 2
        required: false
        description: Two-letter country code used to localize results, normalized to lowercase. Defaults to us.
      - in: query
        name: sort_by
        schema:
          enum:
          - qualityScore
          - newestFirst
          - ratingHigh
          - ratingLow
          type: string
          default: qualityScore
        required: false
        description: 'Review order: qualityScore (most relevant), newestFirst, ratingHigh or ratingLow.'
      - in: query
        name: topic_id
        schema:
          type: string
        required: false
        description: Return only reviews about one topic. Use a topics[].id from a previous response. Mutually exclusive with query.
      - in: query
        name: query
        schema:
          type: string
          examples:
          - parking
        required: false
        description: Free-text filter that returns reviews mentioning these words. Mutually exclusive with topic_id.
      - in: query
        name: num
        schema:
          type: integer
          maximum: 100
          minimum: 1
        required: false
        description: Number of reviews to return. An initial unfiltered request returns 8 by default and accepts 1 through 100; requests with topic_id, query or next_page_token return 10 by default and accept 1 through 20.
      - in: query
        name: next_page_token
        schema:
          type: string
        required: false
        description: Opaque token from a previous response. Send it with the same place, language, country, sort and filters, or follow pagination.next. Tokens expire after 30 minutes.
      - in: query
        name: source_metadata
        schema:
          type: boolean
          default: false
        required: false
        description: Set to true to include each review source's icon and rating scale.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns reviews for one place identified by place_id or data_id; Google Maps responses include both, plus a ready-made reviews_link. Follow pagination.next to fetch more reviews.
      operationId: google_reviews
