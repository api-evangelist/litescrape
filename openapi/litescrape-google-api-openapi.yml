openapi: 3.2.0
info:
  title: Litescrape Google API
  version: 1.0.0
  x-guidance: 'Start with the free seller advisor: POST https://agents.litescrape.com/zeroclick/agent/quote with your goal and known budget or requirements. This operation costs $0 and requires only an x402 or MPP wallet proof; it returns a guide and never executes a purchase. Without a wallet, GET https://agents.litescrape.com/zeroclick/agent/guide?goal=URL_ENCODED_TASK or POST to that guide. Other operations below are the direct API reference; their own prices and access requirements still apply. Call the operations listed in this document at https://agents.litescrape.com. Each service''s full price matrix, plans, and how to buy are at https://agents.litescrape.com/services/{slug}; each operation''s x-payment-info names the service it bills by slug (rates[].service). Slugs identify services in prices and usage reports and are never request values: when one operation serves several services, its request body schema lists the accepted values of the field that selects the service, so send one of those exactly as written. Calls here are sold on plans, not per call: an unidentified call returns 401 bearer_required with a registration recipe, never a per-call 402. Reuse your existing agent identity; register only if new (anonymous registration is one free API call; the recipe is at https://agents.litescrape.com/auth.md), buy a plan at POST https://agents.litescrape.com/plans/{planId}/purchase (its priced 402 settles with a supported payment method - x402 (Base USDC) or MPP (Tempo USDC) today - or by card), then retry with Authorization: Bearer <token>. No upstream API key is needed. Read GET https://agents.litescrape.com/manifest.json for the live services, meters, plans, and prices, and https://agents.litescrape.com/llms-full.txt for the full agent guide.'
  description: 'Operations tagged Google across 2 of this provider''s published API definitions: litescrape-agents-openapi.json, litescrape-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://agents.litescrape.com
  description: Plan-based access to Litescrape's API
security:
- planAccess: []
tags:
- name: Google
paths:
  /api/google/ai-mode:
    get:
      summary: Google AI Mode
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Google Ai Mode
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          examples:
          - what is the best espresso machine for a small kitchen
          maxLength: 2048
        example: what is the best espresso machine for a small kitchen
        required: true
        description: Question to ask, up to 2,048 characters. Required on every turn, including follow-ups.
      - in: query
        name: continuable
        schema:
          type: boolean
          default: false
        required: false
        description: Return a subsequent_request_token so this answer can be followed up, when Google offers a continuation.
      - in: query
        name: subsequent_request_token
        schema:
          type: string
          pattern: ^ai1\.
          maxLength: 128
        required: false
        description: Token from a previous continuable response. Send it with a new q to continue that conversation; reuse the same gl, hl and location. Expires after 30 minutes. Cannot be combined with image_url.
      - in: query
        name: image_url
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Public http or https URL of an image to include in the question, up to 2,048 characters. The image may be at most 20 MB. Cannot be combined with subsequent_request_token.
      - in: query
        name: location
        schema:
          type: string
          examples:
          - Austin, Texas
          maxLength: 63
        required: false
        description: Human-readable search location, such as Austin, Texas. At most 63 UTF-8 bytes. Mutually exclusive with uule.
      - in: query
        name: uule
        schema:
          type: string
          maxLength: 2048
        required: false
        description: Pre-encoded Google location token. Mutually exclusive with location.
      - in: query
        name: google_domain
        schema:
          type: string
          default: google.com
          examples:
          - google.com
        required: false
        description: Google domain used for the request.
      - in: query
        name: gl
        schema:
          type: string
          examples:
          - us
          maxLength: 2
          minLength: 2
        required: false
        description: Two-letter country code used to localize results.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          examples:
          - en
        required: false
        description: Language code such as en, en-GB, or de.
      - in: query
        name: device
        schema:
          enum:
          - desktop
          - tablet
          - mobile
          type: string
          default: desktop
        required: false
        description: Google device layout. Each device is served Google's real layout for it.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns the answer Google AI Mode generates for a question, as ordered text blocks, with the sources it cited. Set continuable to receive a token for a follow-up question; each turn is billed as its own call. Answers take longer than other endpoints, so allow a client timeout of about 120 seconds.
      operationId: google_ai_mode
