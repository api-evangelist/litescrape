openapi: 3.2.0
info:
  title: Litescrape Yelp API
  version: 1.0.0
  x-guidance: 'Start with the free seller advisor: POST https://agents.litescrape.com/zeroclick/agent/quote with your goal and known budget or requirements. This operation costs $0 and requires only an x402 or MPP wallet proof; it returns a guide and never executes a purchase. Without a wallet, GET https://agents.litescrape.com/zeroclick/agent/guide?goal=URL_ENCODED_TASK or POST to that guide. Other operations below are the direct API reference; their own prices and access requirements still apply. Call the operations listed in this document at https://agents.litescrape.com. Each service''s full price matrix, plans, and how to buy are at https://agents.litescrape.com/services/{slug}; each operation''s x-payment-info names the service it bills by slug (rates[].service). Slugs identify services in prices and usage reports and are never request values: when one operation serves several services, its request body schema lists the accepted values of the field that selects the service, so send one of those exactly as written. Calls here are sold on plans, not per call: an unidentified call returns 401 bearer_required with a registration recipe, never a per-call 402. Reuse your existing agent identity; register only if new (anonymous registration is one free API call; the recipe is at https://agents.litescrape.com/auth.md), buy a plan at POST https://agents.litescrape.com/plans/{planId}/purchase (its priced 402 settles with a supported payment method - x402 (Base USDC) or MPP (Tempo USDC) today - or by card), then retry with Authorization: Bearer <token>. No upstream API key is needed. Read GET https://agents.litescrape.com/manifest.json for the live services, meters, plans, and prices, and https://agents.litescrape.com/llms-full.txt for the full agent guide.'
  description: 'Operations tagged Yelp across 2 of this provider''s published API definitions: litescrape-agents-openapi.json, litescrape-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://agents.litescrape.com
  description: Plan-based access to Litescrape's API
security:
- planAccess: []
tags:
- name: Yelp
paths:
  /api/yelp/reviews:
    get:
      summary: Yelp business reviews
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Yelp Reviews
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: A control Yelp does not support (q or not_recommended=true) was set; no call consumed.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: place_id
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          examples:
          - dDz2erKJ_Z2HMur0tQ_iJA
          maxLength: 128
        example: dDz2erKJ_Z2HMur0tQ_iJA
        required: true
        description: 'Encoded Yelp business ID: letters, numbers, underscores, and hyphens.'
      - in: query
        name: yelp_domain
        schema:
          type: string
          default: www.yelp.com
          examples:
          - www.yelp.com
        required: false
        description: Supported first-party localized Yelp hostname, such as www.yelp.co.uk. Links in the response use this hostname.
      - in: query
        name: hl
        schema:
          type: string
          default: en
          pattern: ^[A-Za-z]{2}(-[A-Za-z]{2})?$
          examples:
          - en
        required: false
        description: 'Review language: a two-letter code with an optional two-letter region, such as en or fr-FR.'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 500
        required: false
        description: 'Not supported: Yelp does not offer review text filtering. Any value returns 422 unsupported_parameter.'
      - in: query
        name: sortby
        schema:
          enum:
          - relevance_desc
          - date_desc
          - date_asc
          - rating_desc
          - rating_asc
          - elites_desc
          type: string
          default: relevance_desc
        required: false
        description: Review order.
      - in: query
        name: rating
        schema:
          type: string
          pattern: ^\s*[1-5]\s*(,\s*[1-5]\s*)*$
          examples:
          - 5,4
          maxLength: 32
        required: false
        description: Comma-separated star ratings to include, each from 1 through 5.
      - in: query
        name: not_recommended
        schema:
          type: boolean
          default: false
        required: false
        description: 'Not supported: Yelp does not expose its not-recommended reviews. true returns 422 unsupported_parameter.'
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          maximum: 10000
          minimum: 0
        required: false
        description: Review offset from 0 through 10,000.
      - in: query
        name: num
        schema:
          type: integer
          default: 49
          maximum: 49
          minimum: 1
        required: false
        description: Number of reviews, 1 through 49.
      - in: query
        name: not_recommended_start
        schema:
          type: integer
          minimum: 0
        required: false
        description: Not supported, because not_recommended is not supported. Any value returns 400.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns public reviews for one Yelp business in `reviews`. Get the encoded business ID from `place_id` in Yelp Search results. Page with `start` and `num`, or follow `pagination.next`.
      operationId: yelp_reviews
