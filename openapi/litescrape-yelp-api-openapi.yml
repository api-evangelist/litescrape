  /api/yelp/search:
    get:
      summary: Yelp business search
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Yelp Search
          description: Successful response; one call consumed unless noted otherwise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Invalid or unrecognized parameters; no call consumed.
        '401':
          description: 'Agent identity credential required: register once, then retry with Authorization: Bearer <token>.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The API key has no calls remaining.
        '403':
          description: No active plan covers this call; the body lists the plans that do. Buy one with your bearer, then retry.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: The key's concurrency limit was reached; retry after in-flight requests finish.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Internal failure; the call is refunded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sds_oiSNnl6piiW-6PsH3jP5d_461cecb8dff2a50f_ref0'
          description: Temporarily unavailable (service_unavailable), or the request's timeout expired (request_deadline_exceeded); the call is not billed. Retryable.
      parameters:
      - in: query
        name: find_desc
        schema:
          type: string
          examples:
          - coffee
          maxLength: 500
        required: false
        description: Business name, category, or search terms, up to 500 characters.
      - in: query
        name: find_loc
        schema:
          type: string
          examples:
          - Austin, TX
          maxLength: 500
          minLength: 1
        example: Austin, TX
        required: true
        description: Search location, 1 to 500 characters.
      - in: query
        name: yelp_domain
        schema:
          type: string
          default: www.yelp.com
          examples:
          - www.yelp.com
        required: false
        description: Supported first-party localized Yelp hostname, such as www.yelp.co.uk. Links in the response use this hostname.
      - in: query
        name: l
        schema:
          type: string
          examples:
          - g:-97.80,30.20,-97.70,30.30
          maxLength: 1024
        required: false
        description: Yelp map-bounds token, up to 1,024 characters.
      - in: query
        name: cflt
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          examples:
          - coffee
          maxLength: 128
        required: false
        description: Yelp category identifier, such as coffee.
      - in: query
        name: sortby
        schema:
          enum:
          - recommended
          - rating
          - review_count
          type: string
          default: recommended
        required: false
        description: Result order.
      - in: query
        name: attrs
        schema:
          type: string
          examples:
          - OutdoorSeating
          maxLength: 4096
        required: false
        description: Comma-separated Yelp attribute filters, such as OutdoorSeating; up to 4,096 characters.
      - in: query
        name: start
        schema:
          type: integer
          default: 0
          maximum: 10000
          minimum: 0
        required: false
        description: Result offset from 0 through 10,000.
      - in: query
        name: timeout
        schema:
          type: number
          maximum: 90
          exclusiveMinimum: 0
        required: false
        description: Optional budget for the entire request in seconds, measured from gateway receipt until the response is ready to send. Includes admission, queueing and settlement. Must be greater than 0 and at most 90. On expiry, the call is not billed and returns 503 request_deadline_exceeded with retryable=true and a request ID. Omit to retain the standard server deadline.
      description: Returns Yelp businesses in `organic_results`. Each row's `place_id` is the encoded business ID used by the Yelp Reviews API, and `reviews_link` calls it directly. Page with `start` or follow `pagination`.
      operationId: yelp_search
