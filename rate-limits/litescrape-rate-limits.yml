    section of the reference page and the server's own initialize instructions.
  allowances:
  - name: Keyless MCP allowance, google_search and search
    limit_text: 25 calls per network per UTC day
    max: 25
    window: 1 day
    scope: per-network
    plan: keyless (no API key)
    endpoint: google_search
    source: https://litescrape.com/docs/reference
    note: MCP server section of the reference; "One call at a time per network. Failed calls do not count. Limits reset at
      00:00 UTC."
  - name: Keyless MCP allowance, bing_search, duckduckgo_search and google_maps
    limit_text: 50 calls each per network per UTC day
    max: 50
    window: 1 day
    scope: per-network
    plan: keyless (no API key)
    endpoint: bing_search, duckduckgo_search, google_maps
    source: https://litescrape.com/docs/reference
