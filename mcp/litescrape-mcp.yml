name: Litescrape MCP Server
description: Official Litescrape MCP server. The hosted Streamable HTTP endpoint answered an unauthenticated initialize (serverInfo
  litescrape-mcp-server 0.3.0, protocolVersion 2025-06-18, capabilities.tools.listChanged) and tools/list with ten tools;
  the tool list below is the live response saved verbatim in mcp/litescrape-mcp-tools-list.json. The same server is published
  to npm as litescrape-mcp-server for stdio use and listed in the official MCP registry as com.litescrape/litescrape-mcp-server
  with a streamable-http remote of https://mcp.litescrape.com/mcp.
deployment:
  mode: both
  endpoint: https://mcp.litescrape.com/mcp
  transport: streamable-http
  install: npx -y litescrape-mcp-server
  package: https://www.npmjs.com/package/litescrape-mcp-server
  auth: api-key
  auth_note: 'Optional. Without a key google_search/search (25 calls), bing_search, duckduckgo_search and google_maps (50
    each) are free per network per UTC day, one call at a time; "Authorization: Bearer ls_live_..." unlocks google_ai_mode,
    google_ai_overview, google_shopping, google_reviews and web_fetch, removes the daily limits and allows concurrent calls
    (server initialize instructions; docs/mcp; README). No OAuth: /.well-known/oauth-protected-resource on mcp.litescrape.com
    returns 404.'
  verified: probed
server:
  name: litescrape-mcp-server
  version: 0.3.0
  protocol_version: '2025-06-18'
  capabilities:
    tools:
      listChanged: true
  upstream_api: https://api.litescrape.com
  registry_id: com.litescrape/litescrape-mcp-server
  client_setup: claude mcp add --transport http litescrape https://mcp.litescrape.com/mcp
auth:
  type: api-key
  header: 'Authorization: Bearer <ls_live_ key>'
  required: false
tools:
- name: search
  title: Web search
  description: 'Search the web through Google and return ranked organic results (title, link, snippet) as JSON. Fast mode:
    no Knowledge Graph, ads or AI modules; use google_search for the full results page. Free without an API key (shares the
    google_search allowance).'
  required:
  - q
  parameters:
  - q
  - gl
  - hl
  - location
  - num
  - start
  - result_groups
  requires_api_key: false
  input_schema: mcp/litescrape-mcp-tools-list.json
- name: google_search
  title: Google Search
  description: 'Fetch a first-party Google Search results page as JSON: organic_results plus whichever modules Google served
    (knowledge_graph, answer_box, ai_overview, ads, related_questions, related_searches, local_results, top_stories, inline_videos
    and more). Supports localization, verticals (news, videos, local, shopping, patents), date filters and site restriction.
    Free without an API key: 25 calls per network per day.'
  required: []
  parameters:
  - q
  - ludocid
  - kgmid
  - location
  - uule
  - lat
  - lon
  - radius
  - google_domain
  - gl
  - hl
  - cr
  - lr
  - tbs
  - tbm
  - safe
  - nfpr
  - filter
  - as_sitesearch
  - as_qdr
  - start
  - num
  - device
  - fast_mode
  - result_groups
  requires_api_key: false
  input_schema: mcp/litescrape-mcp-tools-list.json
- name: bing_search
  title: Bing Search
  description: 'Fetch a Bing web search results page as JSON: organic_results plus the modules Bing served (answer_box, knowledge_graph,
    copilot_answer, ads, related_questions, inline_videos, top_stories and more). Free without an API key: 50 calls per network
