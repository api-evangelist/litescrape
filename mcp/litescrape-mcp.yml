- name: duckduckgo_search
  title: DuckDuckGo Search
  description: 'Fetch ranked DuckDuckGo web results (organic_results with title, link, snippet) with region, safety and date
    controls. Free without an API key: 50 calls per network per day.'
  required:
  - q
  parameters:
  - q
  - kl
  - search_assist
