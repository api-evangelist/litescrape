  input_schema: mcp/litescrape-mcp-tools-list.json
- name: google_ai_mode
  title: Google AI Mode
  description: 'Ask Google AI Mode a question and return its generated answer (ordered text_blocks: paragraphs, headings,
    lists, tables, code) with the sources it cited (references). Set continuable to get a token for follow-up questions; image_url
    adds a picture to the prompt. Slow: answers are generated per request. Requires an API key.'
  required:
  - q
  parameters:
  - q
  - location
  - uule
  - google_domain
  - gl
  - hl
  - device
  - continuable
  - subsequent_request_token
  - image_url
  - result_groups
  requires_api_key: true
  input_schema: mcp/litescrape-mcp-tools-list.json
- name: google_shopping
  title: Google Shopping
  description: Search Google Shopping and return the product grid (shopping_results with title, price, source, rating, thumbnail),
    category blocks, sponsored listings and the refinement chips Google renders (filters). Price bounds, sale, shipping and
    small business refinements are mutually exclusive; sort_by combines with one of them. Requires an API key.
  required: []
  parameters:
  - q
  - location
  - uule
  - google_domain
  - gl
  - hl
  - shoprs
  - min_price
  - max_price
  - sort_by
  - free_shipping
  - on_sale
  - small_business
  - start
  - num
  - device
  - result_groups
  requires_api_key: true
  input_schema: mcp/litescrape-mcp-tools-list.json
- name: google_reviews
  title: Google Reviews
  description: Return the Google Maps reviews of one place (reviews with rating, snippet, author, date, likes, owner response,
    guided details and dining subratings) plus place_info. Identify the place by place_id or data_id from a google_maps result.
    Sort, filter by topic or text, and follow pagination.next_page_token for more. Requires an API key.
  required: []
  parameters:
  - place_id
  - data_id
  - hl
  - gl
  - sort_by
  - topic_id
  - query
  - num
  - next_page_token
  - result_groups
  requires_api_key: true
  input_schema: mcp/litescrape-mcp-tools-list.json
- name: web_fetch
  title: Fetch a web page
  description: Render one public web page in a fresh browser and return it as Markdown (default), HTML, plain text or a full-page
    PNG screenshot encoded as base64, with url, title, content and the status_code the site returned. Narrow the content with
    target_selector or remove_selector. Alpha. Requires an API key.
  required:
