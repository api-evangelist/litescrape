  parameters:
  - url
  - respond_with
  - target_selector
  - remove_selector
  - wait_for_selector
  - wait_until
  - page_timeout
  - locale
  - user_agent
  - with_links
  - with_images
  - with_iframe
  - with_shadow_dom
  requires_api_key: true
  input_schema: mcp/litescrape-mcp-tools-list.json
