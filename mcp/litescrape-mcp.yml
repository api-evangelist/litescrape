  input_schema: mcp/litescrape-mcp-tools-list.json
- name: google_ai_overview
  title: Google AI Overview
  description: Return only the AI Overview Google generates for a search (ai_overview with ordered text_blocks and cited references),
    or null when Google shows none. Accepts the google_search parameters. Requires an API key.
  required: []
  parameters:
  - q
  - ludocid
  - kgmid
